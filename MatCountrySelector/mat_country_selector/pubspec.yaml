name: mat_country_selector
description: "A flutter-widget which lets the user choose a country from the countries of ISO 3166-1, shown with their flag and their english name, based on material design."
version: 0.1.1
repository: https://github.com/anionDev/MatCountrySelector
homepage: https://github.com/anionDev/MatCountrySelector
issue_tracker: https://github.com/anionDev/MatCountrySelector/issues
topics:
  - country
  - iso-3166
  - flag
  - dropdown
  - forms

environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  # Only used by the visual-regression-tests (see "test/visual_regression/visual_regression.dart"), which compare
  # the rendered widget with its baseline-image.
  image: 4.9.2
  path: 1.9.1

flutter:
  uses-material-design: true
