<mat-form-field>
  <mat-label>{{ label() }}</mat-label>
  <mat-select [value]="selectedCulture()" (selectionChange)="onSelectionChange($event)">
    @for (option of cultures(); track option.culture) {
    <mat-option [value]="option.culture">{{ option.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
